    --glass-border: rgba(0,0,0,0.08);
    --glass-border-strong: rgba(0,0,0,0.16);
    --input-bg: #F3F4F5;
    --surface-2: #F0F1F2;
    --hover-bg: rgba(0,0,0,0.04);

    --bg: #000000;

  html, body {

const CURRENCY_META = [
  { code: "RUB", label: "Российский рубль", symbol: "₽" },
  { code: "USD", label: "Доллар США", symbol: "$" },
  { code: "EUR", label: "Евро", symbol: "€" },
  { code: "UAH", label: "Гривна", symbol: "₴" },
  { code: "BYN", label: "Белорусский рубль", symbol: "Br" },
  { code: "KZT", label: "Тенге", symbol: "₸" },
  { code: "USDT", label: "Tether", symbol: "USDT" },
  { code: "TON", label: "Toncoin", symbol: "TON" },
  { code: "STARS", label: "Telegram Stars", symbol: "⭐" },
  { code: "WMR", label: "WebMoney WMR", symbol: "WMR", underlying: "RUB" },
  { code: "WMZ", label: "WebMoney WMZ", symbol: "WMZ", underlying: "USD" },
  { code: "WME", label: "WebMoney WME", symbol: "WME", underlying: "EUR" },
  { code: "WMU", label: "WebMoney WMU", symbol: "WMU", underlying: "UAH" },
  { code: "WMB", label: "WebMoney WMB", symbol: "WMB", underlying: "BYN" },
  { code: "WMK", label: "WebMoney WMK", symbol: "WMK", underlying: "KZT" },
];

let CURRENT_BASE_CURRENCY = "RUB";

function currencyMeta(code) {
  return CURRENCY_META.find((c) => c.code === code) || CURRENCY_META[0];
}

function currencyRateToRub(code, rates) {
  if (!code || code === "RUB") return 1;
  const meta = CURRENCY_META.find((c) => c.code === code);
  if (meta && meta.underlying) return currencyRateToRub(meta.underlying, rates);
  return (rates && rates[code]) || 1;
}

function currencyRateToBase(code, rates) {
  return currencyRateToRub(code, rates) / currencyRateToRub(CURRENT_BASE_CURRENCY, rates);
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function startOfWeek(d) {
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7;
  date.setDate(date.getDate() - day);
  date.setHours(0, 0, 0, 0);
  return date;
}

function fmt(n) {
  return fmtCur(n, CURRENT_BASE_CURRENCY);
}

function fmtCur(n, code) {
  const meta = currencyMeta(code || "RUB");
  const v = Math.round(((n || 0) + Number.EPSILON) * 100) / 100;
  const num = v.toLocaleString("ru-RU", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  return meta.symbol.length <= 2 ? `${num} ${meta.symbol}` : `${num} ${meta.symbol}`;
}

function fmtCurOrDash(n, code) {
  if (!n) return "—";
  return fmtCur(n, code);
}

function commissionAmount(revenue, type, value) {
  if (type === "percent") return (revenue * (value || 0)) / 100;
  return value || 0;
}

function entryRevenueRub(e, rates) {
  return (e.revenue || 0) * currencyRateToBase(e.revenueCurrency, rates);
}

function entryCostRub(e, rates) {
  return (e.cost || 0) * currencyRateToBase(e.costCurrency, rates);
}

function computeNet(e, rates) {
  const revRub = entryRevenueRub(e, rates);
  if (e.type === "expense") return -revRub;
  if (e.type === "topup") return revRub;
  const costRub = entryCostRub(e, rates);
  const siteFee = commissionAmount(revRub, e.commissionType, e.commissionValue);
  const withdrawFee = (revRub * (e.withdrawalPercent || 0)) / 100;
  return revRub - costRub - siteFee - withdrawFee;
}

const ICON_PATHS = {

function Icon({ name, size = 16, style }) {
  const d = ICON_PATHS[name];
  if (!d) return null;
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      style={{ flexShrink: 0, ...style }}
    >
      <path d={d} />
    </svg>
  );
}

function Badge({ children, color }) {
  const map = {
    green: { bg: greenDark, fg: green },
    red: { bg: redDark, fg: red },
    amber: { bg: amberDark, fg: amber },
  };
  const c = map[color] || map.green;
  return (
    <span style={{ background: c.bg, color: c.fg, fontSize: 11, fontWeight: 600, padding: "3px 10px", borderRadius: 999, whiteSpace: "nowrap" }}>
      {children}
    </span>
  );
}

function smoothPath(pts) {
  if (pts.length === 0) return "";
  if (pts.length === 1) return `M ${pts[0][0]},${pts[0][1]}`;
  let d = `M ${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const mx = (x0 + x1) / 2;
    const my = (y0 + y1) / 2;
    d += ` Q ${x0},${y0} ${mx},${my}`;
  }
  const [lx, ly] = pts[pts.length - 1];
  d += ` L ${lx},${ly}`;
  return d;
}

function LineChartSvg({ series, width = 640, height = 220 }) {
  const [hoverIdx, setHoverIdx] = useState(null);
  const svgRef = useRef(null);

  if (!series || series.length < 2) {
    return (
      <div style={{ height, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-faint)", fontSize: 12 }}>
        Мало данных для графика — нужно хотя бы 2 дня с записями
      </div>
    );
  }

  const values = series.map((s) => s.value);
  const max = Math.max(...values, 0);
  const min = Math.min(...values, 0);
  const range = max - min || 1;
  const padX = 14;
  const padTop = 18;
  const padBottom = 26;
  const w = width - padX * 2;
  const h = height - padTop - padBottom;
  const stepX = series.length > 1 ? w / (series.length - 1) : 0;
  const yFor = (v) => padTop + h - ((v - min) / range) * h;
  const xFor = (i) => padX + i * stepX;
  const zeroY = yFor(0);
  const pts = series.map((s, i) => [xFor(i), yFor(s.value)]);
  const last = series[series.length - 1];
  const first = series[0];
  const trendColor = last.value >= 0 ? "#22C55E" : "#EF4444";
  const linePath = smoothPath(pts);
  const areaPath = `${linePath} L ${pts[pts.length - 1][0]},${zeroY} L ${pts[0][0]},${zeroY} Z`;
  const gradId = "dashChartGrad";

  const gridLines = [max, (max + min) / 2, min].filter((v, i, arr) => arr.indexOf(v) === i);

  const handleMove = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const relX = ((e.clientX - rect.left) / rect.width) * width;
    let idx = Math.round((relX - padX) / (stepX || 1));
    idx = Math.max(0, Math.min(series.length - 1, idx));
    setHoverIdx(idx);
  };

  const hovered = hoverIdx != null ? series[hoverIdx] : null;
  const hoverX = hoverIdx != null ? xFor(hoverIdx) : null;
  const hoverY = hoverIdx != null ? yFor(series[hoverIdx].value) : null;
  const tooltipLeft = hoverX != null && hoverX > width - 90;

  return (
    <div style={{ position: "relative" }}>
      <svg
        ref={svgRef}
        width="100%"
        height={height}
        viewBox={`0 0 ${width} ${height}`}
        preserveAspectRatio="none"
        style={{ display: "block", cursor: "crosshair" }}
        onMouseMove={handleMove}
        onMouseLeave={() => setHoverIdx(null)}
      >
        <defs>
          <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={trendColor} stopOpacity="0.32" />
            <stop offset="100%" stopColor={trendColor} stopOpacity="0" />
          </linearGradient>
        </defs>

        {gridLines.map((v, i) => (
          <g key={i}>
            <line x1={padX} y1={yFor(v)} x2={padX + w} y2={yFor(v)} stroke="var(--glass-border)" strokeWidth="1" strokeDasharray={v === 0 ? "4 4" : "0"} />
            <text x={padX + w} y={yFor(v) - 4} fontSize="9" fill="var(--text-faint)" textAnchor="end">
              {fmt(v)}
            </text>
          </g>
        ))}

        <path d={areaPath} fill={`url(#${gradId})`} />
        <path d={linePath} fill="none" stroke={trendColor} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />

        {hoverIdx != null && (
          <line x1={hoverX} y1={padTop} x2={hoverX} y2={padTop + h} stroke="var(--glass-border-strong)" strokeWidth="1" strokeDasharray="3 3" />
        )}

        {pts.map(([x, y], i) => {
          const isLast = i === series.length - 1;
          const isHover = i === hoverIdx;
          if (!isLast && !isHover) return null;
          return (
            <g key={i}>
              {isHover && <circle cx={x} cy={y} r="6" fill={trendColor} opacity="0.2" />}
              <circle cx={x} cy={y} r={isHover ? 4.5 : 3.5} fill={trendColor} stroke="var(--bg)" strokeWidth="1.5" />
            </g>
          );
        })}

        <text x={padX} y={height - 6} fontSize="9" fill="var(--text-faint)">
          {first.date.slice(5)}
        </text>
        <text x={padX + w} y={height - 6} fontSize="9" fill="var(--text-faint)" textAnchor="end">
          {last.date.slice(5)}
        </text>
      </svg>

      {hovered && (
        <div
          style={{
            position: "absolute",
            top: Math.max(0, hoverY - 46),
            left: tooltipLeft ? undefined : `${(hoverX / width) * 100}%`,
            right: tooltipLeft ? `${100 - (hoverX / width) * 100}%` : undefined,
            transform: tooltipLeft ? "translateX(8px)" : "translateX(-50%)",
            background: "var(--glass-bg-raised)",
            border: `1px solid ${"var(--glass-border-strong)"}`,
            borderRadius: 10,
            padding: "6px 10px",
            fontSize: 11,
            fontFamily: "inherit",
            whiteSpace: "nowrap",
            pointerEvents: "none",
            boxShadow: "var(--shadow)",
            backdropFilter: "var(--glass-blur)",
          }}
        >
          <div style={{ color: "var(--text-muted)", marginBottom: 2 }}>
            {new Date(hovered.date + "T00:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long" })}
          </div>

function pluralRu(n, one, few, many) {
  const mod10 = n % 10;
  const mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
  return many;
}

function genId() {
  return Date.now() + Math.random().toString(16).slice(2);
}

function parseCSVRows(text) {
  const lines = text
    .split(/\r?\n/)
    .map((l) => l.replace(/\r$/, ""))
    .filter((l) => l.trim().length > 0);
  if (lines.length < 1) throw new Error("empty");
  const delimiter = lines[0].includes(";") && !lines[0].includes(",") ? ";" : ",";
  return lines.map((l) => splitCsvLine(l, delimiter));
}

function splitCsvLine(line, delimiter) {
  const cells = [];
  let cur = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      inQuotes = !inQuotes;
      continue;
    }
    if (ch === delimiter && !inQuotes) {
      cells.push(cur.trim());
      cur = "";
      continue;
    }
    cur += ch;
  }
  cells.push(cur.trim());
  return cells;
}

function cleanHeaderCell(v) {
  return String(v ?? "")
    .replace(/^\ufeff/, "")
    .trim()
    .toLowerCase();
}

const HEADER_ALIASES = {
  date: ["date", "дата", "дата продажи", "дата заказа", "дата добавления", "dt"],
  product: ["название товара", "product", "название", "наименование", "name", "товар/услуга", "позиция", "заказ", "товар"],
  revenue: ["revenue", "сумма", "цена", "выручка", "price", "amount", "итого", "к оплате", "стоимость", "сумма заказа", "total", "оплачено", "зачислено"],
  invoiceId: ["invoiceid", "invoice_id", "inv", "номер заказа", "orderid", "order_id", "№", "номер", "id"],
  currency: ["currency", "валюта", "валюта платежа"],
};

function findHeaderIndex(headerRow, field) {
  const norm = headerRow.map(cleanHeaderCell);
  const aliases = HEADER_ALIASES[field];
  for (const alias of aliases) {
    const idx = norm.indexOf(alias);
    if (idx !== -1) return idx;
  }
  for (let i = 0; i < norm.length; i++) {
    for (const alias of aliases) {
      if (norm[i] && norm[i].includes(alias)) return i;
    }
  }
  return -1;
}

function findHeaderRowIndex(rows) {
  const limit = Math.min(rows.length, 6);
  for (let i = 0; i < limit; i++) {
    const r = rows[i];
    if (!r) continue;
    const d = findHeaderIndex(r, "date");
    const p = findHeaderIndex(r, "product");
    const rev = findHeaderIndex(r, "revenue");
    if (d !== -1 && p !== -1 && rev !== -1) return i;
  }
  return -1;
}

function parseAmount(raw) {
  if (raw == null) return NaN;
  if (typeof raw === "number") return raw;
  let s = String(raw).trim();
  s = s.replace(/[^\d,.\-]/g, "");
  if (s.includes(",") && s.includes(".")) {
    s = s.replace(/,/g, "");
  } else if (s.includes(",") && !s.includes(".")) {
    s = s.replace(",", ".");
  }
  return parseFloat(s);
}

function normalizeOcrDigits(s) {
  return s.replace(/[\u041e\u043e O]/g, "0").replace(/[\u0417\u0437]/g, "3").replace(/[\u0431\u042c\u044c]/g, "6").replace(/[lI|]/g, "1");
}

function extractProductCandidates(lines) {
  const priceWordRe = /^\d{2,6}$/;
  const currencyWordRe = /^(\u20bd|\u0440\u0443\u0431\.?|\u0420|P)$/i;
  const gluedPriceRe = /^(\d{2,6})[\u0420P]$/i;

  const priceRows = [];
  lines.forEach((line, li) => {
    const words = (line.words || []).filter((w) => (w.text || "").trim());
    const anchors = [];
    for (let i = 0; i < words.length; i++) {
      const raw = words[i].text.trim();
      const normalized = normalizeOcrDigits(raw);
      if (priceWordRe.test(normalized)) {
        const next = words[i + 1];
        if (next && currencyWordRe.test((next.text || "").trim())) {
          anchors.push({ x0: words[i].bbox.x0, price: parseInt(normalized, 10) });
          i++;
          continue;
        }
      }
      const m = normalized.match(gluedPriceRe) || raw.match(gluedPriceRe);
      if (m) anchors.push({ x0: words[i].bbox.x0, price: parseInt(normalizeOcrDigits(m[1]), 10) });
    }
    if (anchors.length) priceRows.push({ lineIndex: li, anchors });
  });

  const candidates = [];
  const colTolerance = 20;
  priceRows.forEach(({ lineIndex, anchors }) => {
    const titleBuckets = anchors.map(() => []);
    for (let li = lineIndex + 1; li <= lineIndex + 3 && li < lines.length; li++) {
      if (priceRows.some((pr) => pr.lineIndex === li)) break;
      const words = (lines[li].words || []).filter((w) => (w.text || "").trim());
      words.forEach((w) => {
        let idx = -1;
        for (let k = 0; k < anchors.length; k++) {
          if (anchors[k].x0 - colTolerance <= w.bbox.x0) idx = k;
          else break;
        }
        if (idx !== -1) titleBuckets[idx].push(w.text);
      });
      if (titleBuckets.some((b) => b.length)) break;
    }
    anchors.forEach((a, idx) => {
      if (a.price <= 0) return;
      candidates.push({ id: genId(), name: titleBuckets[idx].join(" ").trim() || "\u0422\u043E\u0432\u0430\u0440", price: a.price, selected: true });
    });
  });

  return candidates;
}
function excelSerialToISO(n) {
  const d = new Date(Math.round((n - 25569) * 86400 * 1000));
  return d.toISOString().slice(0, 10);
}

function parseDateCell(raw) {
  if (raw == null || raw === "") return "";
  if (typeof raw === "number") return excelSerialToISO(raw);
  const s = String(raw).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);
  if (m) {
    let [, dd, mm, yyyy] = m;
    if (yyyy.length === 2) yyyy = "20" + yyyy;
    return `${yyyy}-${mm.padStart(2, "0")}-${dd.padStart(2, "0")}`;
  }
  return s.slice(0, 10);
}

function mapTableToSales(rawRows) {
  const headerRowIdx = findHeaderRowIndex(rawRows);
  if (headerRowIdx === -1) {
    const err = new Error("headers");
    err.headerPreview = rawRows[0] ? rawRows[0].join(", ") : "(файл пуст)";
    throw err;
  }
  const headerRow = rawRows[headerRowIdx];
  const dataRows = rawRows.slice(headerRowIdx + 1);
  const dateIdx = findHeaderIndex(headerRow, "date");
  const productIdx = findHeaderIndex(headerRow, "product");
  const revenueIdx = findHeaderIndex(headerRow, "revenue");
  const invoiceIdx = findHeaderIndex(headerRow, "invoiceId");
  const currencyIdx = findHeaderIndex(headerRow, "currency");
  const rows = [];
  for (const row of dataRows) {
    if (!row || row.every((c) => c === "" || c == null)) continue;
    const dateStr = parseDateCell(row[dateIdx]);
    const revenueVal = parseAmount(row[revenueIdx]);
    const productVal = String(row[productIdx] ?? "").trim();
    if (!dateStr || !productVal || isNaN(revenueVal)) continue;
    let currencyVal = null;
    if (currencyIdx !== -1) {
      const raw = String(row[currencyIdx] ?? "").trim().toUpperCase();
      if (raw && CURRENCY_META.some((c) => c.code === raw)) currencyVal = raw;
    }
    rows.push({
      date: dateStr,
      product: productVal,
      revenue: revenueVal,
      currency: currencyVal,
      invoiceId: invoiceIdx !== -1 && row[invoiceIdx] !== "" && row[invoiceIdx] != null ? String(row[invoiceIdx]) : null,
    });
  }
  return rows;
}

      revenueCurrency: type === "sale" ? revenueCurrency : "RUB",

  async function exportCSV() {
    setExportMessage(null);
    const headers = ["date", "type", "product", "revenue", "revenueCurrency", "cost", "costCurrency", "commissionType", "commissionValue", "withdrawalPercent", "net"];
    const escape = (v) => {
      const s = String(v ?? "");
      return s.includes(",") || s.includes('"') ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const rows = entries.map((e) => [
      e.date,
      e.type,
      e.product,
      e.revenue,
      e.revenueCurrency || "RUB",
      e.cost,
      e.costCurrency || "RUB",
      e.commissionType,
      e.commissionValue,
      e.withdrawalPercent || 0,
      Math.round(computeNet(e, rates) * 100) / 100,
    ]);
    const csv = [headers.join(","), ...rows.map((r) => r.map(escape).join(","))].join("\n");
    try {
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "ggsel_journal.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setExportMessage({ ok: "Файл сохранён." });
      pushToast("CSV сохранён");
    } catch (e) {
      setExportMessage({ error: "Не получилось сохранить файл. Попробуй ещё раз." });
    }
  }

  function processSales(data) {
    const existingInvoiceIds = new Set(entries.filter((e) => e.invoiceId != null).map((e) => String(e.invoiceId)));
    const newEntries = [];
    let matched = 0;
    let unmatched = 0;
    let skipped = 0;
    for (const item of data) {
      if (!item || !item.product || item.revenue == null || isNaN(item.revenue) || !item.date) continue;
      if (item.invoiceId != null && existingInvoiceIds.has(String(item.invoiceId))) {
        skipped++;
        continue;
      }
      const p = findProductByName(item.product);
      if (p) matched++;
      else unmatched++;
      newEntries.push({
        id: genId(),
        type: "sale",
        date: String(item.date).slice(0, 10),
        product: item.product,
        productId: p ? p.id : null,
        revenue: parseFloat(item.revenue),
        revenueCurrency: item.currency || (p ? p.priceCurrency || "RUB" : "RUB"),
        cost: p ? p.cost : 0,
        costCurrency: p ? p.costCurrency || "RUB" : "RUB",
        commissionType: p ? p.commissionType : "percent",
        commissionValue: p ? p.commissionValue : 0,
        withdrawalPercent: p ? p.withdrawalPercent || 0 : 0,
        invoiceId: item.invoiceId != null ? item.invoiceId : null,
      });
      if (item.invoiceId != null) existingInvoiceIds.add(String(item.invoiceId));
    }
    if (newEntries.length > 0) persistEntries([...newEntries, ...entries]);
    const batchRevenue = newEntries.reduce((s, e) => s + entryRevenueRub(e, rates), 0);
    const batchNet = newEntries.reduce((s, e) => s + computeNet(e, rates), 0);
    const byProduct = {};
    for (const e of newEntries) {
      byProduct[e.product] = (byProduct[e.product] || 0) + 1;
    }
    const productCounts = Object.entries(byProduct)
      .map(([name, count]) => ({ name, count }))
      .sort((a, b) => b.count - a.count);
    const dates = newEntries.map((e) => e.date).sort();
    const periodStart = dates.length ? dates[0] : null;
    const periodEnd = dates.length ? dates[dates.length - 1] : null;
    setImportResult({ matched, unmatched, skipped, total: newEntries.length, batchRevenue, batchNet, productCounts, periodStart, periodEnd });
    setImportText("");
  }

  function handleFiles(fileList) {
    const file = fileList && fileList[0];
    if (!file) return;
    const ext = file.name.split(".").pop().toLowerCase();
    const reader = new FileReader();
    if (ext === "csv") {
      reader.onload = () => {
        try {
          const rows = parseCSVRows(String(reader.result));
          processSales(mapTableToSales(rows));
        } catch (e) {
          setImportResult({ error: `Не нашёл столбцы date/product/revenue в CSV. Первая строка: ${e.headerPreview || "?"}` });
        }
      };
      reader.readAsText(file);
    } else if (ext === "xlsx" || ext === "xls") {
      reader.onload = () => {
        try {
          const wb = XLSX.read(new Uint8Array(reader.result), { type: "array" });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true });
          if (!rows.length) throw new Error("empty");
          processSales(mapTableToSales(rows));
        } catch (e) {
          setImportResult({
            error:
              e.headerPreview
                ? `Не нашёл столбцы date/product/revenue в файле. Первая строка: ${e.headerPreview}`
                : "Не получилось прочитать Excel-файл — проверь, что это не повреждённый и не запароленный файл.",
          });
        }
      };
      reader.readAsArrayBuffer(file);
    } else if (ext === "json") {
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result));
          if (!Array.isArray(data)) throw new Error("not array");
          processSales(data);
        } catch (e) {
          setImportResult({ error: "Не получилось прочитать JSON-файл — ожидается массив объектов." });
        }
      };
      reader.readAsText(file);
    } else {
      setImportResult({ error: "Поддерживаются файлы .csv, .xlsx, .xls и .json" });
    }
  }

  function runOcr(fileList) {
    const file = fileList && fileList[0];
    if (!file) return;
    if (typeof Tesseract === "undefined") {
      setOcrError("Модуль распознавания не загрузился. Попробуй ещё раз или пришли скриншот прямо в чат Claude — я посчитаю суммы сам.");
      return;
    }
    setOcrLoading(true);
    setOcrError(null);
    setOcrAmounts([]);
    setOcrTotal(0);
    const reader = new FileReader();
    reader.onload = () => {
      const ocrTimeout = new Promise((_, reject) => setTimeout(() => reject(new Error("ocr-timeout")), 45000));
      Promise.race([
        Tesseract.recognize(reader.result, "eng", {
          workerPath: "https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/worker.min.js",
          corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@4.0.4/tesseract-core.wasm.js",
          langPath: "https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int",
          tessedit_char_whitelist: "0123456789.,$USDusd ",
        }),
        ocrTimeout,
      ])
        .then(({ data: { text: recognizedText } }) => {
          const regex = /(?:\$|usd)\s?(\d{1,3}(?:[ ,]\d{3})*(?:[.,]\d{1,2})?)|(\d{1,3}(?:[ ,]\d{3})*(?:[.,]\d{1,2})?)\s?(?:\$|usd)/gi;
          const matches = [...recognizedText.matchAll(regex)]
            .map((m) => parseAmount(m[1] || m[2]))
            .filter((n) => !isNaN(n));
          const total = matches.reduce((s, n) => s + n, 0);
          setOcrAmounts(matches);
          setOcrTotal(total);
          setOcrLoading(false);
        })
        .catch(() => {
          setOcrError("Не получилось распознать текст — возможно, в этой песочнице заблокирована загрузка модели OCR по сети, или распознавание заняло слишком много времени. Надёжный вариант: пришли скриншот прямо мне в чат, и я посчитаю суммы сам.");
          setOcrLoading(false);
        });
    };
    reader.readAsDataURL(file);
  }

  function upscaleForOcr(dataUri) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const targetMin = 2200;
        const scale = Math.min(3, Math.max(1, targetMin / Math.min(img.width, img.height)));
        if (scale <= 1.05) {
          resolve(dataUri);
          return;
        }
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/png"));
      };
      img.onerror = () => resolve(dataUri);
      img.src = dataUri;
    });
  }

  function runProductOcr(fileList) {
    const file = fileList && fileList[0];
    if (!file) return;
    if (typeof Tesseract === "undefined") {
      setProdOcrError("Модуль распознавания не загрузился. Попробуй ещё раз.");
      return;
    }
    setProdOcrLoading(true);
    setProdOcrError(null);
    setProdOcrCandidates([]);
    const reader = new FileReader();
    reader.onload = () => {
      const ocrTimeout = new Promise((_, reject) => setTimeout(() => reject(new Error("ocr-timeout")), 90000));
      upscaleForOcr(reader.result)
        .then((preparedImage) =>
          Promise.race([
            Tesseract.recognize(preparedImage, "rus+eng", {
              workerPath: "https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/worker.min.js",
              corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@4.0.4/tesseract-core.wasm.js",
              langPath: "https://cdn.jsdelivr.net/gh/naptha/tessdata@gh-pages/4.0.0_best_int",
            }),
            ocrTimeout,
          ])
        )
        .then(({ data }) => {
          const lines = data.lines && data.lines.length ? data.lines : (data.text || "").split("\n").map((t) => ({ text: t }));
          const candidates = extractProductCandidates(lines);
          if (candidates.length === 0) {
            setProdOcrError("Не нашлось ни одной цены в рублях на скриншоте. Попробуй скриншот почётче или добавь товары вручную.");
          }
          setProdOcrCandidates(candidates);
          setProdOcrLoading(false);
        })
        .catch(() => {
          setProdOcrError("Не получилось распознать скриншот — возможно, заблокирована загрузка модели OCR по сети или это заняло слишком много времени.");
          setProdOcrLoading(false);
        });
    };
    reader.readAsDataURL(file);
  }

  }

  function updateProdCandidate(id, field, value) {
    setProdOcrCandidates((list) => list.map((c) => (c.id === id ? { ...c, [field]: value } : c)));
  }

  function removeProdCandidate(id) {
    setProdOcrCandidates((list) => list.filter((c) => c.id !== id));
  }

  function addSelectedProdCandidates() {
    const chosen = prodOcrCandidates.filter((c) => c.selected && c.name.trim() && (parseFloat(c.price) || 0) > 0);
    if (chosen.length === 0) return;
    const newProducts = chosen.map((c) => ({
      id: genId(),
      name: c.name.trim(),
      price: parseFloat(c.price) || 0,
      priceCurrency: "RUB",
      cost: 0,
      costCurrency: "RUB",
      commissionType: "percent",
      commissionValue: 0,
      withdrawalPercent: 0,
      purchasedQty: 0,
      lowStockThreshold: null,
      folderId: null,
      archived: false,
    }));
    persistProducts([...newProducts, ...products]);
    setProdOcrCandidates([]);
  }

  const dashboardRange = useMemo(() => {
    const now = new Date();
    let from = null;
    let to = null;
    let label = "";
    if (dashPreset === "today") {
      from = todayISO();
      to = todayISO();
      label = "Сегодня";
    } else if (dashPreset === "week") {
      from = startOfWeek(now).toISOString().slice(0, 10);
      to = todayISO();
      label = "Эта неделя";
    } else if (dashPreset === "month") {
      from = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
      to = todayISO();
      label = "Этот месяц";
    } else if (dashPreset === "year") {
      from = `${now.getFullYear()}-01-01`;
      to = todayISO();
      label = "Этот год";
    } else if (dashPreset === "custom" && dashFrom && dashTo) {
      from = dashFrom;
      to = dashTo;
      label = `${dashFrom} — ${dashTo}`;
    } else {
      label = "Всё время";
    }
    return { from, to, label };
  }, [dashPreset, dashFrom, dashTo]);

  const dashboardStats = useMemo(() => {
    const { from, to } = dashboardRange;
    const filtered = entries.filter((e) => (!from || e.date >= from) && (!to || e.date <= to));
    const sales = filtered.filter((e) => e.type === "sale");
    const revenue = sales.reduce((s, e) => s + entryRevenueRub(e, rates), 0);
    const net = filtered.reduce((s, e) => s + computeNet(e, rates), 0);
    const byProduct = {};
    for (const e of sales) {
      byProduct[e.product] = (byProduct[e.product] || 0) + 1;
    }
    const productCounts = Object.entries(byProduct)
      .map(([name, count]) => ({ name, count }))
      .sort((a, b) => b.count - a.count);

    const byDate = {};
    for (const e of filtered) {
      byDate[e.date] = (byDate[e.date] || 0) + computeNet(e, rates);
    }
    const dailySeries = Object.entries(byDate)
      .map(([date, value]) => ({ date, value }))
      .sort((a, b) => (a.date < b.date ? -1 : 1))
      .slice(-30);

    const avgCheck = sales.length ? revenue / sales.length : 0;
    const marginPercent = revenue > 0 ? (net / revenue) * 100 : 0;
    let bestDay = null;
    for (const [date, value] of Object.entries(byDate)) {
      if (!bestDay || value > bestDay.value) bestDay = { date, value };
    }
    const activeDays = Object.keys(byDate).length;
    const avgPerDay = activeDays ? net / activeDays : 0;

    return { revenue, net, count: sales.length, productCounts, dailySeries, avgCheck, marginPercent, bestDay, activeDays, avgPerDay };
  }, [entries, rates, dashboardRange]);

  const stockStats = useMemo(() => {
    let unitsLeft = 0;
    let stockCost = 0;
    let potentialNet = 0;
    for (const p of products) {
      if (p.archived) continue;
      const remaining = Math.max(0, (p.purchasedQty || 0) - soldCount(p.id));
      unitsLeft += remaining;
      stockCost += remaining * (p.cost || 0) * rateToBase(p.costCurrency);
      const priceRub = (p.price || 0) * rateToBase(p.priceCurrency);
      const fees = commissionAmount(priceRub, p.commissionType, p.commissionValue) + (priceRub * (p.withdrawalPercent || 0)) / 100;
      potentialNet += remaining * (priceRub - (p.cost || 0) * rateToBase(p.costCurrency) - fees);
    }
    return { unitsLeft, stockCost, potentialNet };
  }, [products, entries, rates]);

  const financeSummary = useMemo(() => {
    let revenue = 0;
    let cost = 0;
    let siteFees = 0;
    let withdrawFees = 0;
    let expenses = 0;
    let topups = 0;
    for (const e of entries) {
      const revRub = entryRevenueRub(e, rates);
      if (e.type === "expense") {
        expenses += revRub;
      } else if (e.type === "topup") {
        topups += revRub;
      } else {
        revenue += revRub;
        cost += entryCostRub(e, rates);
        siteFees += commissionAmount(revRub, e.commissionType, e.commissionValue);
        withdrawFees += (revRub * (e.withdrawalPercent || 0)) / 100;
      }
    }
    const net = revenue - cost - siteFees - withdrawFees - expenses + topups;
    return { revenue, cost, siteFees, withdrawFees, expenses, topups, net };
  }, [entries, rates]);

  const plannerCalc = useMemo(() => {
    const qty = parseFloat(plQty) || 0;
    const costPerUnit = (parseFloat(plCost) || 0) * rateToBase(plCostCurrency);
    const pricePerUnit = (parseFloat(plPrice) || 0) * rateToBase(plPriceCurrency);
    const totalCost = costPerUnit * qty;
    const grossRevenue = pricePerUnit * qty;

    // Часть покупателей пропадает и не выходит на связь для получения товара
    // (не присылает данные аккаунта и т.п.). Возврат они запросить не могут —
    // деньги остаются у продавца, но и себестоимость на них тратить не нужно,
    // раз товар/доступ так и не был передан.
    const accessRiskPercent = plAccessRiskEnabled ? Math.min(100, Math.max(0, parseFloat(plAccessRisk) || 0)) : 0;
    const noShowRate = accessRiskPercent / 100;
    const noShowUnits = qty * noShowRate;
    const deliveredUnits = qty - noShowUnits;
    const realizedCost = costPerUnit * deliveredUnits;
    const costSaved = totalCost - realizedCost;

    const revenue = grossRevenue;
    const siteFeePerUnit = commissionAmount(pricePerUnit, plCommType, parseFloat(plCommValue) || 0);
    const siteFees = siteFeePerUnit * qty;
    const withdrawFees = (revenue * (parseFloat(plWithdrawal) || 0)) / 100;
    const netProfit = revenue - siteFees - withdrawFees - realizedCost;
    const available = financeSummary.net;
    const enough = totalCost <= available;
    const shortfall = enough ? 0 : totalCost - available;
    const affordableQty = costPerUnit > 0 ? Math.floor(available / costPerUnit) : Infinity;
    const marginPercent = revenue > 0 ? (netProfit / revenue) * 100 : 0;
    const markupPercent = costPerUnit > 0 ? ((pricePerUnit - costPerUnit) / costPerUnit) * 100 : 0;
    const roiPercent = realizedCost > 0 ? (netProfit / realizedCost) * 100 : 0;
    return {
      qty,
      totalCost,
      grossRevenue,
      revenue,
      accessRiskPercent,
      noShowUnits,
      deliveredUnits,
      realizedCost,
      costSaved,
      siteFees,
      withdrawFees,
      netProfit,
      available,
      enough,
      shortfall,
      affordableQty,
      marginPercent,
      markupPercent,
      roiPercent,
      balanceAfterPurchase: available - totalCost,
      balanceAfterSellThrough: available + netProfit,
    };
  }, [plQty, plCost, plCostCurrency, plPrice, plPriceCurrency, plCommType, plCommValue, plWithdrawal, plAccessRiskEnabled, plAccessRisk, rates, financeSummary.net]);

  const perProduct = useMemo(() => {
    const map = {};
    for (const e of entries) {
      if (e.type !== "sale") continue;
      const key = e.product;
      if (!map[key]) map[key] = { name: key, count: 0, revenue: 0, net: 0 };
      map[key].count += 1;
      map[key].revenue += entryRevenueRub(e, rates);
      map[key].net += computeNet(e, rates);
    }
    return Object.values(map).sort((a, b) => b.net - a.net);
  }, [entries, rates]);

  const ordersFilterActive = orderSearch.trim() !== "" || orderTypeFilter !== "all" || orderFrom !== "" || orderTo !== "";

  const filteredEntries = useMemo(() => {
    if (!ordersFilterActive) return entries;
    const q = orderSearch.trim().toLowerCase();
    return entries.filter((e) => {
      if (orderTypeFilter !== "all" && e.type !== orderTypeFilter) return false;
      if (orderFrom && e.date < orderFrom) return false;
      if (orderTo && e.date > orderTo) return false;
      if (q && !(e.product || "").toLowerCase().includes(q)) return false;
      return true;
    });
  }, [entries, orderSearch, orderTypeFilter, orderFrom, orderTo, ordersFilterActive]);

  const filteredStats = useMemo(() => {
    let net = 0;
    let revenue = 0;
    for (const e of filteredEntries) {
      net += computeNet(e, rates);
      if (e.type === "sale") revenue += entryRevenueRub(e, rates);
    }
    return { count: filteredEntries.length, net, revenue };
  }, [filteredEntries, rates]);

  const grouped = useMemo(() => {
    const map = {};
    for (const e of filteredEntries) {
      if (!map[e.date]) map[e.date] = [];
      map[e.date].push(e);
    }
    return Object.entries(map).sort((a, b) => (a[0] < b[0] ? 1 : -1));
  }, [filteredEntries]);

  const journalDayBlocks = useMemo(() => {
    const blocks = [];
    let shown = 0;
    for (const [d, list] of grouped) {
      if (shown >= journalVisibleCount) break;
      const slice = list.slice(0, journalVisibleCount - shown);
      blocks.push([d, list, slice]);
      shown += slice.length;
    }
    return blocks;
  }, [grouped, journalVisibleCount]);

  const journalTotalEntries = useMemo(() => grouped.reduce((s, [, list]) => s + list.length, 0), [grouped]);

  const visibleProducts = useMemo(() => {
    const q = productSearch.trim().toLowerCase();
    const list = products.filter((p) => {
      if (p.archived) return false;
      if (folderFilter === "none" && p.folderId) return false;
      if (folderFilter !== "all" && folderFilter !== "none" && p.folderId !== folderFilter) return false;
      if (q && !(p.name || "").toLowerCase().includes(q)) return false;
      return true;
    });
    const netOf = (p) => {
      const priceRub = (p.price || 0) * rateToBase(p.priceCurrency);
      const costRub = (p.cost || 0) * rateToBase(p.costCurrency);
      const fees = commissionAmount(priceRub, p.commissionType, p.commissionValue) + (priceRub * (p.withdrawalPercent || 0)) / 100;
      return priceRub - costRub - fees;
    };
    const sorted = [...list];
    if (productSort === "name") sorted.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ru"));
    else if (productSort === "profit") sorted.sort((a, b) => netOf(b) - netOf(a));
    else if (productSort === "stock") sorted.sort((a, b) => ((b.purchasedQty || 0) - soldCount(b.id)) - ((a.purchasedQty || 0) - soldCount(a.id)));
    else if (productSort === "price") sorted.sort((a, b) => (b.price || 0) * rateToBase(b.priceCurrency) - (a.price || 0) * rateToBase(a.priceCurrency));
    return sorted;
  }, [products, folderFilter, productSearch, productSort, entries, rates]);

  const archivedProducts = useMemo(() => products.filter((p) => p.archived), [products]);

  const dataStats = useMemo(() => {
    const days = new Set();
    let first = null;
    for (const e of entries) {
      if (!e.date) continue;
      days.add(e.date);
      if (!first || e.date < first) first = e.date;
    }
    return {
      dayCount: days.size,
      firstDate: first ? new Date(first + "T00:00:00").toLocaleDateString("ru-RU") : null,
    };
  }, [entries]);

  const lowStockProducts = useMemo(() => {
    return products
      .filter((p) => !p.archived)
      .map((p) => {
        const purchased = p.purchasedQty || 0;
        const remaining = purchased - soldCount(p.id);
        const threshold = p.lowStockThreshold != null && p.lowStockThreshold !== "" ? Number(p.lowStockThreshold) : Math.ceil(purchased * 0.25);
        return { name: p.name, remaining, low: purchased > 0 && remaining > 0 && remaining <= threshold };
      })
      .filter((p) => p.low);
  }, [products, entries]);

  if (!loaded) {
    return (
      <div style={{ padding: 40, textAlign: "center", color: textMuted, fontFamily: sans, background: bg, minHeight: "100%" }}>
        Загрузка данных…
      </div>
    );
  }

  const pageTitle = (title, subtitle) => (
    <div style={{ marginBottom: 22, display: "flex", gap: 12, alignItems: "flex-start" }}>
      <div style={{ width: 4, borderRadius: 4, background: green, alignSelf: "stretch", minHeight: 34 }} />
      <div>
        <div style={{ fontSize: 24, fontWeight: 700 }}>{title}</div>
        {subtitle && <div style={{ fontSize: 13, color: textMuted, marginTop: 6 }}>{subtitle}</div>}
      </div>
    </div>
  );

  const metric = (title, value, sub, iconName) => (
    <div className="ggsel-card" style={{ ...glass, borderRadius: 18, padding: "18px 20px", flex: "1 1 160px", minWidth: 160, position: "relative", overflow: "hidden" }}>
      <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase", color: textFaint, marginBottom: 12 }}>
        {title}
      </div>
      <div style={{ fontSize: 26, fontWeight: 700, color: value >= 0 ? text : red, whiteSpace: "nowrap" }}>{fmt(value)}</div>
      {sub && <div style={{ fontSize: 12, color: textMuted, marginTop: 6 }}>{sub}</div>}
      <Icon name={iconName} size={34} style={{ position: "absolute", right: 14, top: 14, color: "var(--icon-faint)" }} />
    </div>
  );

  const financeRow = (lbl, value) => (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "12px 0", borderBottom: `1px solid ${glassBorder}` }}>
      <span style={{ fontSize: 13, color: textMuted }}>{lbl}</span>
      <span style={{ fontFamily: mono, fontSize: 14, fontWeight: 600, color: text }}>{fmt(value)}</span>
    </div>
  );

  const productNetPreview = (priceStr, priceCur, costStr, costCur, commType, commVal, wdVal, purchasedStr) => {
    const priceRub = (parseFloat(priceStr) || 0) * rateToBase(priceCur);
    const costRub = (parseFloat(costStr) || 0) * rateToBase(costCur);
    const purchased = parseFloat(purchasedStr) || 0;
    const siteFeePerUnit = commissionAmount(priceRub, commType, parseFloat(commVal) || 0);
    const withdrawFeePerUnit = (priceRub * (parseFloat(wdVal) || 0)) / 100;
    const netPerUnit = priceRub - costRub - siteFeePerUnit - withdrawFeePerUnit;
    return { netPerUnit, batchNet: netPerUnit * purchased, purchased };
  };

  function productBreakeven(p) {
    const purchased = p.purchasedQty || 0;
    const priceRub = (p.price || 0) * rateToBase(p.priceCurrency);
    const costRub = (p.cost || 0) * rateToBase(p.costCurrency);
    const siteFeePerUnit = commissionAmount(priceRub, p.commissionType, p.commissionValue);
    const withdrawFeePerUnit = (priceRub * (p.withdrawalPercent || 0)) / 100;
    const grossPerUnit = priceRub - siteFeePerUnit - withdrawFeePerUnit;
    const totalCost = costRub * purchased;
    if (grossPerUnit <= 0 || totalCost <= 0) return null;
    const breakevenQty = Math.ceil(totalCost / grossPerUnit);
    const sold = soldCount(p.id);
    return { breakevenQty, sold, remaining: Math.max(0, breakevenQty - sold), reached: sold >= breakevenQty };
  }

  function applyPlannerProduct(id) {
    setPlProductId(id);
    if (!id) return;
    const p = products.find((x) => x.id === id);
    if (!p) return;
    setPlCost(String(p.cost ?? ""));
    setPlCostCurrency(p.costCurrency || "RUB");
    setPlPrice(String(p.price ?? ""));
    setPlPriceCurrency(p.priceCurrency || "RUB");
    setPlCommType(p.commissionType || "percent");
    setPlCommValue(String(p.commissionValue ?? ""));
    setPlWithdrawal(String(p.withdrawalPercent ?? ""));
  }

  const journal = view !== "orders" ? null : (
    <div>
      {grouped.length === 0 && (
        <div style={{ color: textMuted, fontSize: 13, padding: "28px 0", textAlign: "center" }}>
          {ordersFilterActive ? "По этому фильтру ничего не найдено." : "Записей пока нет. Добавь первую продажу или расход."}
        </div>
      )}
      {journalDayBlocks.map(([d, fullList, list]) => {
        const dayNet = fullList.reduce((s, e) => s + computeNet(e, rates), 0);
        const dateObj = new Date(d + "T00:00:00");
        const dLabel = dateObj.toLocaleDateString("ru-RU", { day: "numeric", month: "long", weekday: "short" });
        return (
          <div key={d} style={{ marginBottom: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: textMuted, marginBottom: 8 }}>
              <span>{dLabel}</span>
              <span style={{ fontFamily: mono, color: dayNet >= 0 ? green : red }}>{fmt(dayNet)}</span>
            </div>
            {list.length < fullList.length && (
              <div style={{ fontSize: 11, color: textFaint, marginBottom: 8 }}>
                Показаны {list.length} из {fullList.length} записей за этот день
              </div>
            )}
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {list.map((e) => {
                const net = computeNet(e, rates);
                return (
                  <div key={e.id} className="ggsel-card" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 14px", ...glass, borderRadius: 14 }}>
                    <div style={{ display: "flex", flexDirection: "column" }}>
                      <span style={{ fontSize: 13, fontWeight: 600 }}>{e.product}</span>
                      <span style={{ fontSize: 11, color: textMuted, fontFamily: mono, marginTop: 2 }}>
                        {e.type === "sale"
                          ? `продажа ${fmtCur(e.revenue, e.revenueCurrency)} · себест. ${fmtCurOrDash(e.cost, e.costCurrency)} · комиссия ${e.commissionType === "percent" ? e.commissionValue + "%" : fmt(e.commissionValue)} · вывод ${e.withdrawalPercent || 0}%`
                          : e.type === "topup"
                          ? `пополнение ${fmtCur(e.revenue, e.revenueCurrency)}`
                          : `расход ${fmtCur(e.revenue, e.revenueCurrency)}`}
                      </span>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ fontFamily: mono, fontSize: 14, fontWeight: 600, color: net >= 0 ? green : red }}>
                        {net >= 0 ? "+" : ""}
                        {fmt(net)}
                      </span>
                      <button
                        onClick={() => startEditEntry(e)}
                        aria-label="Изменить запись"
                        title="Изменить"
                        style={{ background: "none", border: "none", cursor: "pointer", color: editingEntryId === e.id ? green : textMuted, padding: 4 }}
                      >
                        <Icon name="pencil" size={15} />
                      </button>
                      <button onClick={() => removeEntry(e.id)} aria-label="Удалить запись" title="Удалить" style={{ background: "none", border: "none", cursor: "pointer", color: textMuted, padding: 4 }}>
                        <Icon name="trash" size={15} />
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
      {journalTotalEntries > journalVisibleCount && (
        <button
          onClick={() => setJournalVisibleCount((v) => v + 150)}
          style={{ display: "block", margin: "8px auto 0", background: "transparent", border: `1px solid ${glassBorder}`, color: textMuted, borderRadius: 999, padding: "9px 18px", fontFamily: sans, fontSize: 12, fontWeight: 600, cursor: "pointer" }}
        >
          Показать ещё записи ({journalTotalEntries - journalVisibleCount} осталось)
        </button>
      )}
    </div>
  );

  return (
    <div style={{ minHeight: "100%", fontFamily: sans, color: text }}>
      <style>{`
        .ggsel-layout { display: flex; align-items: flex-start; gap: 20px; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .ggsel-sidebar { width: 224px; flex-shrink: 0; border-radius: 24px; padding: 18px 12px; position: sticky; top: 20px; }
        .ggsel-main { flex: 1; min-width: 0; padding-bottom: 40px; }
        .ggsel-nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 3px; transition: background 0.15s ease, color 0.15s ease; }
        .ggsel-nav-item:hover { background: var(--hover-bg); }
        .ggsel-card { transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease; }
        .ggsel-card:hover { transform: translateY(-2px); border-color: var(--glass-border-strong); box-shadow: var(--shadow-hover); }
        .ggsel-view { animation: ggselFadeIn 0.25s ease; }
        @keyframes ggselFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        input:focus, select:focus, textarea:focus { border-color: ${green} !important; outline: none; box-shadow: 0 0 0 3px rgba(34,197,94,0.14); }
        input, select, textarea { transition: border-color 0.15s ease, box-shadow 0.15s ease; }
        button { transition: opacity 0.15s ease, transform 0.1s ease; }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        button:disabled:hover { opacity: 0.6; }
        a { transition: opacity 0.15s ease; }
        a:hover { opacity: 0.85; }
        .ggsel-toast { animation: ggselToastIn 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
        @keyframes ggselToastIn { from { opacity: 0; transform: translateX(20px) scale(0.96); } to { opacity: 1; transform: translateX(0) scale(1); } }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border-strong); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: content-box; }
        ::selection { background: rgba(34,197,94,0.3); }
        @media (max-width: 760px) {
          .ggsel-layout { flex-direction: column; padding: 12px; gap: 12px; }
          .ggsel-sidebar { width: 100%; box-sizing: border-box; position: relative; top: 0; }
          .ggsel-nav-list { display: flex; gap: 6px; overflow-x: auto; }
          .ggsel-nav-item { margin-bottom: 0; white-space: nowrap; }
        }
      `}</style>

      <div className="ggsel-layout">
        <div className="ggsel-sidebar" style={glass}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 8px 18px" }}>
            <div style={{ width: 28, height: 28, borderRadius: 8, background: "linear-gradient(135deg, #34D07F, #1F9D5C)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
                <path d="M6 5h10" />
                <path d="M7 5c0 3.2 1.6 5.5 4 5.9" />
                <path d="M16 5c0 3.2-1.6 5.5-4 5.9" />
                <path d="M11 10.9v6.6" />
                <path d="M8.3 20h6.4" />
                <path d="M11 16.5c-1.6-1.1-2.4-2.3-2.1-3.6 0.3-1.3 1.6-1.4 1.6-2.7 0-1-0.9-1.2-0.9-2.3 0-1 0.9-1.5 0.9-1.5" />
                <circle cx="9.9" cy="9.6" r="0.55" fill="#ffffff" stroke="none" />

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false };
  }
  static getDerivedStateFromError() {
    return { hasError: true };
  }
  componentDidCatch(error, info) {
    console.error("Ledger crashed:", error, info);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100vh", background: "#0B0D10", color: "#fff", fontFamily: "-apple-system, sans-serif", gap: 16, padding: 24, textAlign: "center" }}>
          <div style={{ fontSize: 18, fontWeight: 700 }}>Что-то пошло не так</div>
          <div style={{ fontSize: 13, color: "#9CA3AF", maxWidth: 420 }}>
            Приложение столкнулось с ошибкой интерфейса и не может продолжить работу. Данные не потеряны — они хранятся отдельно на этом компьютере. Нажми кнопку, чтобы перезапустить.
          </div>
          <button
            onClick={() => window.location.reload()}
            style={{ background: "#22C55E", color: "#08290F", border: "none", borderRadius: 10, padding: "12px 24px", fontSize: 14, fontWeight: 700, cursor: "pointer" }}
          >
            Перезапустить
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

window.addEventListener("error", (e) => console.error("Global error:", e.error || e.message));
window.addEventListener("unhandledrejection", (e) => console.error("Unhandled promise rejection:", e.reason));

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(
  <ErrorBoundary>
    <Ledger />
  </ErrorBoundary>
);
</script>
</body>
</html>
